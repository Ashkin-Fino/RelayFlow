# Load local environment variables from .env
spring.config.import=optional:file:./keys.env[.properties]

logging.level.com.airtribe.relayflow=INFO

spring.application.name=relayflow
server.port=${SERVER_PORT:8080}

spring.datasource.url=${RELAY_DB_URL:jdbc:postgresql://localhost:5432/relayflow}
spring.datasource.username=${RELAY_DB_USER:postgres}
spring.datasource.password=${RELAY_DB_PASSWORD:}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

relay.seed.enabled=${RELAY_SEED_ENABLED:true}
relay.mock-world.url=${MOCK_WORLD_URL:http://localhost:9210}
relay.demo-token=${RELAY_DEMO_TOKEN:}

relay.ai.adapter=${RELAY_AI_ADAPTER:mock}
relay.ai.base-url=${RELAY_AI_BASE_URL:http://localhost:9001/v1}
relay.ai.model=${RELAY_AI_MODEL:alpha-small}
relay.ai.api-key=${RELAY_AI_API_KEY:}
relay.ai.timeout-seconds=${RELAY_AI_TIMEOUT_SECONDS:30}

relay.worker.enabled=${RELAY_WORKER_ENABLED:true}
relay.worker.poll-interval-ms=${RELAY_WORKER_POLL_INTERVAL_MS:1000}
relay.worker.lease-seconds=${RELAY_WORKER_LEASE_SECONDS:60}

# Durable per-node retry policy. max-attempts includes the initial attempt.
relay.worker.retry.max-attempts=${RELAY_WORKER_RETRY_MAX_ATTEMPTS:3}
relay.worker.retry.initial-delay-seconds=${RELAY_WORKER_RETRY_INITIAL_DELAY_SECONDS:2}
relay.worker.retry.max-delay-seconds=${RELAY_WORKER_RETRY_MAX_DELAY_SECONDS:30}
