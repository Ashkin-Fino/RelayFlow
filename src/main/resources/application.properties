spring.application.name=relayflow
server.port=${SERVER_PORT:8080}

spring.datasource.url=${RELAY_DB_URL:jdbc:postgresql://localhost:5432/relayflow}
spring.datasource.username=${RELAY_DB_USER:postgres}
spring.datasource.password=${RELAY_DB_PASSWORD:password}
spring.datasource.driver-class-name=org.postgresql.Driver
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
spring.flyway.enabled=true
spring.flyway.locations=classpath:db/migration

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

relay.seed.enabled=${RELAY_SEED_ENABLED:true}
relay.mock-world.url=${MOCK_WORLD_URL:http://localhost:9210}
relay.demo-token=${RELAY_DEMO_TOKEN:}
